---
x-minio-common: &minio-common
  image: minio/minio:latest
  command: server --console-address ":9001" http://minio{1...4}/data{1...2}
  expose: ['9000', '9001']
  environment:
    MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
    MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
  networks: [shared-network]
  healthcheck:
    test: [CMD, mc, ready, local]
    interval: 5s
    timeout: 5s
    retries: 5

services:
  image-service:
    build: .
    env_file: [.env]
    ports: [8081:8081]
    networks: [shared-network]
    depends_on:
      minio1:
        condition: service_healthy
      minio2:
        condition: service_healthy
      minio3:
        condition: service_healthy
      minio4:
        condition: service_healthy

  minio1:
    <<: *minio-common
    hostname: minio1
    volumes: [data1-1:/data1, data1-2:/data2]

  minio2:
    <<: *minio-common
    hostname: minio2
    volumes: [data2-1:/data1, data2-2:/data2]

  minio3:
    <<: *minio-common
    hostname: minio3
    volumes: [data3-1:/data1, data3-2:/data2]

  minio4:
    <<: *minio-common
    hostname: minio4
    volumes: [data4-1:/data1, data4-2:/data2]

networks:
  shared-network:
    external: true

volumes:
  data1-1:
  data1-2:
  data2-1:
  data2-2:
  data3-1:
  data3-2:
  data4-1:
  data4-2:
